<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARDUST — Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="subpage">
  <header class="navbar">
    <a href="index.html" class="nav-brand-block">
      <span class="nav-brand">STARDUST</span>
      <span class="nav-brand-sub">Mirror Protocol</span>
    </a>
    <nav class="nav-links">

  <a
    href="index.html"
    class="nav-link"
  >
    HOME
  </a>

  <a
    href="questions/question-page.html"
    class="nav-link"
  >
    QUESTIONS
  </a>

  <a
    href="leaderboard.html"
    class="nav-link is-active"
  >
    LEADERBOARD
  </a>

  <a
    href="login.html"
    class="nav-link nav-login"
    id="navLogin"
  >
    LOGIN
  </a>

</nav>
  </header>

  <main class="page">
    <div class="page-head">
      <p class="eyebrow">SYSTEM STATUS</p>
      <p class="page-sub">
      LIVE MISSION STANDINGS.
      </p>
    </div>
    <table class="board">

  <thead>
    <tr>
      <th>Rank</th>
      <th>Team</th>
      <th>Score</th>
    </tr>
  </thead>

  <tbody id="leaderboardBody">

    <tr>
      <td colspan="3">
        LOADING MISSION DATA...
      </td>
    </tr>

  </tbody>

</table>
  </main>
  <script>
(() => {
  "use strict";

  document.addEventListener(
    "DOMContentLoaded",
    async () => {

      const body =
        document.getElementById(
          "leaderboardBody"
        );

      if (!body) {
        return;
      }


      try {

        const response =
          await fetch(
            "/api/leaderboard",
            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json"
              }
            }
          );


        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }


        const data =
          await response.json();


        body.innerHTML = "";


        /*
         * No teams have scored.
         */

        if (
          !data.leaderboard ||
          data.leaderboard.length === 0
        ) {

          body.innerHTML = `
            <tr>
              <td colspan="3">
                NO TEAMS HAVE SCORED YET.
              </td>
            </tr>
          `;

          return;
        }


        /*
         * Create leaderboard rows.
         */

        data.leaderboard.forEach(
          (team) => {

            const row =
              document.createElement(
                "tr"
              );


            if (team.rank === 1) {

              row.classList.add(
                "board-top"
              );

            }


            row.innerHTML = `
              <td class="board-rank">
                ${String(
                  team.rank
                ).padStart(2, "0")}
              </td>

              <td class="board-team">
                ${team.team}
              </td>

              <td class="board-score">
                ${team.score}
              </td>
            `;


            body.appendChild(row);

          }
        );


      } catch (error) {

        console.error(
          "[STARDUST] Leaderboard failed:",
          error
        );


        body.innerHTML = `
          <tr>
            <td colspan="3">
              LEADERBOARD CONNECTION FAILED.
            </td>
          </tr>
        `;

      }

    }
  );

})();
</script>

<script src="session.js"></script>
</body>
</html>
