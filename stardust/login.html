<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARDUST — Login</title>
  <link rel="stylesheet" href="style.css">

</head>
<body class="subpage">
  <header class="navbar">
    <a href="index.html" class="nav-brand-block">
      <span class="nav-brand">STARDUST</span>
      <span class="nav-brand-sub">Mirror Protocol</span>
    </a>
    <nav class="nav-links">

  <a
    href="index.html"
    class="nav-link"
  >
    HOME
  </a>

  <a
    href="questions/question-page.html"
    class="nav-link"
  >
    QUESTIONS
  </a>

  <a
    href="leaderboard.html"
    class="nav-link"
  >
    LEADERBOARD
  </a>

  <a
    href="login.html"
    class="nav-link is-active nav-login"
    id="navLogin"
  >
    LOGIN
  </a>

</nav>
  </header>

  <main class="page">
    <div class="page-head">
      <p class="eyebrow">SECURE ENTRY</p>
      <h1 class="page-title">Login</h1>
      <p class="page-sub">Access to the STARDUST archive is restricted. Use your mission credentials to proceed.</p>
    </div>
   <div class="login-panel">

  <form id="loginForm" class="login-form">

    <label for="teamInput">TEAM NAME</label>

    <input
      id="teamInput"
      type="text"
      placeholder="ENTER TEAM NAME"
      autocomplete="username"
      required
    >

    <label for="passwordInput">PASSWORD</label>

    <input
      id="passwordInput"
      type="password"
      placeholder="ENTER PASSWORD"
      autocomplete="current-password"
      required
    >

    <button type="submit" class="cta">
      <span class="cta-label">AUTHENTICATE</span>
      <span class="cta-arrow">→</span>
    </button>

    <p id="loginMessage" class="login-message"></p>

  </form>

</div>
<script>
(() => {
  "use strict";

  const form = document.getElementById("loginForm");
  const teamInput = document.getElementById("teamInput");
  const passwordInput = document.getElementById("passwordInput");
  const message = document.getElementById("loginMessage");

  if (!form) return;

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const team = teamInput.value.trim();
    const password = passwordInput.value;

    if (!team || !password) {
      message.textContent = "MIRROR: CREDENTIALS REQUIRED.";
      return;
    }

    message.textContent = "MIRROR: VERIFYING CREDENTIALS.";

    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          team,
          password
        })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        message.textContent = `MIRROR: ${data.message}`;
        return;
      }

      message.textContent = `MIRROR: ${data.message}`;

      window.setTimeout(() => {
        window.location.href = "index.html";
      }, 700);

    } catch (error) {
      console.error("[STARDUST] Login failed:", error);
      message.textContent = "MIRROR: BACKEND CONNECTION FAILED.";
    }
  });
})();
</script>
  </main>
</body>
</html>
